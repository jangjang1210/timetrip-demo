<html lang="ko">
<head>

<title>타임-트립 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Prototype viewer: quiet frame around one fixed 390x844 phone; sidebar on desktop, slim bar on phones */
:root{
  --ground:#E8DFD3; --panel:#F6F0E7; --ink:#2B2118; --muted:#5E4E40; --accent:#9E4413;
  --chip:#FFFFFF; --bezel:#2B2118; --rule:#D6C8B6;
  --ui:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#1C1713; --panel:#262019; --ink:#F1E8DC; --muted:#BBA996; --accent:#EE9A62;
  --chip:#332A22; --bezel:#0E0B09; --rule:#3B3128; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#1C1713; --panel:#262019; --ink:#F1E8DC; --muted:#BBA996; --accent:#EE9A62;
  --chip:#332A22; --bezel:#0E0B09; --rule:#3B3128; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui)}
.tt-shell{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:32px 16px;box-sizing:border-box;min-height:100%}
.tt-side{width:240px;display:flex;flex-direction:column;gap:18px;flex:none}
.tt-side h1{margin:0;font-size:20px;font-weight:700;text-wrap:balance}
.tt-side p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.tt-group{display:flex;flex-direction:column;gap:2px}
.tt-group h2{margin:0 0 4px;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tt-group button{text-align:left;font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.tt-group button:hover{background:var(--panel)}
.tt-group button[aria-current="page"]{background:var(--chip);color:var(--accent);font-weight:700}
.tt-group button:focus-visible,.tt-bar button:focus-visible,.tt-bar select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tt-holder{position:relative;flex:none;border-radius:44px;box-shadow:0 0 0 10px var(--bezel),0 24px 60px rgba(0,0,0,.28);overflow:hidden;background:#FBF6EF}
.tt-phone{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden;background:#FBF6EF}
.tt-bar{display:none}
.tt-stage{position:sticky;top:32px}
@media (max-width:719px){
  html,body{overflow:hidden}
  .tt-shell{flex-direction:column;align-items:center;gap:0;padding:0;height:100%}
  .tt-side{display:none}
  .tt-bar{display:flex;gap:8px;align-items:center;width:100%;box-sizing:border-box;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--rule);flex:none}
  .tt-bar button{font:inherit;font-size:13px;font-weight:700;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--rule);background:var(--chip);color:var(--ink);flex:none}
  .tt-bar select{font:inherit;font-size:13px;min-height:36px;flex:1;min-width:0;border-radius:8px;border:1px solid var(--rule);background:var(--chip);color:var(--ink);padding:0 8px}
  .tt-stage{position:static;flex:1;display:flex;align-items:flex-start;justify-content:center;width:100%;overflow:hidden}
  .tt-holder{border-radius:0;box-shadow:none}
}
</style>
</head>

  </div>
</div>

REG["S5-Talk"] = (function(){
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0, rec: false }; }
  renderVals() {
    const turns = [
      { user: '마당에 감나무가 있었지. 가을이면 감이 주황색으로 주렁주렁 달렸어.', bomi: '감이 주렁주렁 달린 마당, 눈에 선해요. 그 감은 누가 따 주셨어요?' },
      { user: '아버지가 장대로 따 주셨지. 나는 밑에서 바구니를 들고 있었고.', bomi: '아버님과 함께한 가을이었네요. 그때 길동 님 마음은 어떠셨어요?' },
      { user: '든든했지. 지금 생각하면 그게 아버지 사랑이었던 것 같아.', bomi: '그 마음, 지은 님께도 꼭 들려주세요. 오늘 이야기는 여기까지 정리해 둘게요.' }
    ];
    const n = this.state.n;
    const rec = this.state.rec;
    let msgs = [{ bomi: true, me: false, text: '길동 님, 어릴 적 살던 집 마당에는 어떤 나무가 있었나요?' }];
    for (let i = 0; i < n; i++) {
      msgs.push({ bomi: false, me: true, text: turns[i].user });
      msgs.push({ bomi: true, me: false, text: turns[i].bomi });
    }
    msgs = msgs.slice(-3);
    const stageIdx = Math.min(n, 2);
    const labels = ['기억 회상', '감정 연결', '의미 재구성'];
    const done = n >= 3;
    return {
      remain: [12, 8, 4, 1][n],
      stages: labels.map((l, i) => ({
        label: l,
        bar: i <= stageIdx ? '#C2561A' : '#E8DACB',
        color: i === stageIdx ? '#9E4413' : '#5E4E40',
        weight: i === stageIdx ? 700 : 500
      })),
      messages: msgs,
      rec: rec,
      notRec: !rec,
      micOffDisp: rec ? 'none' : 'block',
      micOnDisp: rec ? 'block' : 'none',
      done: done,
      talking: !done,
      micBg: rec ? '#7A340E' : '#C2561A',
      micLabel: rec ? '멈추기' : '눌러서 말하기',
      micHint: rec ? '다 말씀하셨으면 한 번 더 눌러 주세요' : '버튼을 누르고 편하게 말씀하세요',
      toggle: () => {
        if (this.state.rec) this.setState({ rec: false, n: Math.min(this.state.n + 1, 3) });
        else this.setState({ rec: true });
      }
    };
  }
}
return Component;
})();

REG["G8-BookEdit"] = (function(){
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      list: [
        { id: 'child', title: '어린 시절', stories: 9, photos: 3 },
        { id: 'work', title: '직장 생활', stories: 8, photos: 1 },
        { id: 'family', title: '가족', stories: 10, photos: 5 }
      ]
    };
  }
  move(i, d) {
    const l = this.state.list.slice();
    const j = i + d;
    if (j < 0 || j >= l.length) return;
    const t = l[i]; l[i] = l[j]; l[j] = t;
    this.setState({ list: l });
  }
  renderVals() {
    const l = this.state.list;
    const ai = (c) => Math.max(0, c.stories - c.photos);
    const redrawn = this.state.redrawn || {};
    return {
      photoTotal: l.reduce((a, c) => a + c.photos, 0),
      aiTotal: l.reduce((a, c) => a + ai(c), 0),
      chapters: l.map((c, i) => ({
        no: i + 1, title: c.title, stories: c.stories, photos: c.photos, ai: ai(c),
        noAi: ai(c) === 0,
        redrawLabel: redrawn[c.id] ? '새로 그렸어요' : '삽화 다시 그리기',
        redraw: () => this.setState({ redrawn: Object.assign({}, this.state.redrawn, { [c.id]: true }) }),
        first: i === 0, last: i === l.length - 1,
        upLabel: c.title + ' 위로 올리기', downLabel: c.title + ' 아래로 내리기',
        up: () => this.move(i, -1),
        down: () => this.move(i, 1),
        addPhoto: () => this.setState({ list: this.state.list.map((x) => x.id === c.id ? Object.assign({}, x, { photos: x.photos + 1 }) : x) })
      }))
    };
  }
}
return Component;
})();
REG["G9-Order"] = (function(){

REG["G10-Alerts"] = (function(){

      inviteLabel: count >= 4 ? '최대 4명까지 초대했어요' : '가족 초대 문자 보내기',
      invite: () => this.setState({ extra: Math.min(2, (this.state.extra || 0) + 1) }),
      callLabel: this.state.called ? '전화 연결 중' : '아버지께 전화하기',
      call: () => this.setState({ called: !this.state.called }),
      gaps: [2, 3, 5].map((n) => {

  }
}

})();

var EXACT = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
function lookup(path, scopes){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  var parts = path.split('.'), head = parts[0], v;
  for (var i = 0; i < scopes.length; i++){ if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], head)) { v = scopes[i][head]; break; } }
  for (var j = 1; j < parts.length && v != null; j++) v = v[parts[j]];
  return v;
}
function raw(str, scopes){ var m = EXACT.exec(str || ''); return m ? lookup(m[1], scopes) : str; }
function interp(str, scopes){ return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, function(_, p){ var v = lookup(p, scopes); return v == null ? '' : String(v); }); }
function renderChildren(src, scopes, out){ var c = src.childNodes; for (var i = 0; i < c.length; i++) renderNode(c[i], scopes, out); }
function renderNode(n, scopes, out){
  if (n.nodeType === 3){ var t = n.nodeValue; out.appendChild(document.createTextNode(t.indexOf('{{') >= 0 ? interp(t, scopes) : t)); return; }
  if (n.nodeType !== 1) return;
  var tag = n.localName;
  if (tag === 'sc-for'){
    var list = raw(n.getAttribute('list'), scopes) || [], as = n.getAttribute('as') || 'item';
    for (var k = 0; k < list.length; k++){ var s = {}; s[as] = list[k]; s.$index = k; renderChildren(n, [s].concat(scopes), out); }
    return;
  }
  if (tag === 'sc-if'){ if (raw(n.getAttribute('value'), scopes)) renderChildren(n, scopes, out); return; }
  var el = n.cloneNode(false), attrs = Array.prototype.slice.call(n.attributes);
  attrs.forEach(function(a){
    var name = a.name, v = a.value;
    if (name.indexOf('hint-') === 0){ el.removeAttribute(name); return; }
    if (name.indexOf('on') === 0){
      el.removeAttribute(name);
      var fn = raw(v, scopes);
      if (typeof fn === 'function'){
        var ev = name.slice(2);
        if (ev === 'change' && (el.localName === 'textarea' || (el.localName === 'input' && !/checkbox|radio/.test(el.type)))) ev = 'input';
        el.addEventListener(ev, fn);
      }
      return;
    }
    if (name === 'defaultvalue'){ el.removeAttribute(name); el.value = interp(v, scopes); return; }
    if (v.indexOf('{{') < 0) return;
    var val = EXACT.test(v) ? raw(v, scopes) : interp(v, scopes);
    if (name === 'value'){ el.removeAttribute(name); el.value = val == null ? '' : val; return; }
    if (name === 'checked' || name === 'disabled'){
      if (val) el.setAttribute(name, ''); else el.removeAttribute(name);
      if (name === 'checked') el.checked = !!val;
      return;
    }
    if (val === false || val == null){ if (name.indexOf('aria-') === 0) el.setAttribute(name, 'false'); else el.removeAttribute(name); return; }
    el.setAttribute(name, String(val));
  });
  renderChildren(n, scopes, el);
  out.appendChild(el);
}
SCREENS.forEach(function(s){ s.tpl = document.createElement('template'); s.tpl.innerHTML = s.html; s.Cls = REG[s.id]; });

var nav = document.getElementById('tt-nav'), sel = document.getElementById('tt-select');
var groups = [['start', '시작'], ['senior', '어르신 앱'], ['guardian', '보호자 앱'], ['agency', '기관용 (2027 하반기 예정)']];
groups.forEach(function(g){
  var box = document.createElement('div'); box.className = 'tt-group';
  var h = document.createElement('h2'); h.textContent = g[1]; box.appendChild(h);
  var og = document.createElement('optgroup'); og.label = g[1];
  SCREENS.filter(function(s){ return s.group === g[0]; }).forEach(function(s){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = s.title; b.dataset.id = s.id;
    b.addEventListener('click', function(){ app.go(s.id); });
    box.appendChild(b);
    var o = document.createElement('option'); o.value = s.id; o.textContent = s.title; og.appendChild(o);
  });
  nav.appendChild(box); sel.appendChild(og);
});
sel.addEventListener('change', function(){ app.go(sel.value); });
document.getElementById('tt-home').addEventListener('click', function(){ app.go('Start'); });

app = {
  cur: null, inst: null,
  go: function(id){
    var s = SCREENS.filter(function(x){ return x.id === id; })[0];
    if (!s) return;
    this.cur = s; this.inst = new s.Cls({});
    this.render(true);
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){
      if (b.dataset.id === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    sel.value = id;
    try { if (history.replaceState) history.replaceState(null, '', '#' + id); } catch (e) {}
  },
  render: function(fresh){
    var ae = document.activeElement, fid = null, range = null, scrolls = [];
    if (!fresh){
      if (ae && ae.id && mount.contains(ae)){ fid = ae.id; try { range = [ae.selectionStart, ae.selectionEnd]; } catch (e) {} }
      Array.prototype.forEach.call(mount.querySelectorAll('*'), function(el, i){ if (el.scrollTop) scrolls.push([i, el.scrollTop]); });
    }
    while (mount.firstChild) mount.removeChild(mount.firstChild);
    var st = document.createElement('style'); st.textContent = this.cur.css; mount.appendChild(st);
    var frag = document.createDocumentFragment();
    renderChildren(this.cur.tpl.content, [this.inst.renderVals()], frag);
    mount.appendChild(frag);
    if (!fresh){
      var all = mount.querySelectorAll('*');
      scrolls.forEach(function(p){ if (all[p[0]]) all[p[0]].scrollTop = p[1]; });
      if (fid){ var f = document.getElementById(fid); if (f){ f.focus(); if (range && range[0] != null && f.setSelectionRange) { try { f.setSelectionRange(range[0], range[1]); } catch (e) {} } } }
    }
  }
};
mount.addEventListener('click', function(e){
  var a = e.target.closest ? e.target.closest('a[href]') : null; if (!a) return;
  var h = a.getAttribute('href');
  if (/\.dc\.html$/.test(h)){ e.preventDefault(); app.go(h.replace(/^.*\//, '').replace('.dc.html', '')); }
});

var holder = document.getElementById('tt-holder'), phone = document.getElementById('tt-phone'), stage = document.getElementById('tt-stage');
function fit(){
  var mobile = window.innerWidth < 720, s;
  if (mobile){
    var availW = window.innerWidth, availH = stage.clientHeight || (window.innerHeight - 52);
    s = Math.min(availW / 390, availH / 844, 1.25);
  } else {
    s = Math.min(1, (window.innerHeight - 84) / 844);
    if (s < 0.6) s = 0.6;
  }
  phone.style.transform = 'scale(' + s + ')';
  holder.style.width = Math.round(390 * s) + 'px';
  holder.style.height = Math.round(844 * s) + 'px';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ setTimeout(fit, 200); });
fit();
var start = (location.hash || '').slice(1);
app.go(SCREENS.some(function(s){ return s.id === start; }) ? start : 'Start');
})();
